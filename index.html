<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nova拼读乐园" />
  <title>xinxin (Nova) 专属 · 剑桥 KB1 自然拼读 iPad 点读机</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Fredoka', 'Noto Sans SC', sans-serif;
      background-color: #FFFDF7;
      background-image: radial-gradient(#CBD5E1 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }
    /* Custom scrollbars for internal panels */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    /* Bauhaus playful shadow */
    .bauhaus-card {
      border: 3.5px solid #1E293B;
      box-shadow: 7px 7px 0px #1E293B;
    }
    .bauhaus-btn {
      border: 2.5px solid #1E293B;
      box-shadow: 3.5px 3.5px 0px #1E293B;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
    }
    .bauhaus-btn:active {
      transform: translate(2.5px, 2.5px);
      box-shadow: 1px 1px 0px #1E293B;
    }
    /* Phoneme blocks */
    .ph-block {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 3px solid #1E293B;
      box-shadow: 4px 4px 0px #1E293B;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .ph-block:active {
      transform: scale(0.95);
    }
    .ph-c {
      background-color: #DBEAFE; /* Soft Blue for Consonants */
      color: #1E3A8A;
    }
    .ph-v {
      background-color: #FEF3C7; /* Warm Amber/Orange for Vowels */
      color: #B45309;
    }
    .ph-s {
      background-color: #F1F5F9; /* Muted Dashed for Silent letters */
      color: #94A3B8;
      border-style: dashed;
      border-color: #64748B;
      box-shadow: none;
    }
    .ph-active {
      transform: scale(1.24) translateY(-8px) !important;
      box-shadow: 0 12px 24px -4px rgba(245, 158, 11, 0.55) !important;
      border-color: #EA580C !important;
      background-color: #FDE68A !important;
      color: #9A3412 !important;
      z-index: 20;
    }
    .syllable-dot {
      font-size: 2.2rem;
      font-weight: 900;
      color: #94A3B8;
      margin: 0 4px;
      align-self: center;
    }
    @keyframes popStar {
      0% { transform: scale(0.3) rotate(-20deg); opacity: 0; }
      60% { transform: scale(1.25) rotate(8deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .star-pop {
      animation: popStar 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
  </style>
</head>
<body class="flex flex-col text-slate-800">

  <!-- ==================== TOP APP BAR ==================== -->
  <header class="shrink-0 bg-[#FFFDF7] border-b-4 border-slate-800 px-3 sm:px-5 py-2.5 flex items-center justify-between gap-2 z-30">
    <!-- Left: Brand & iPad Audio Status -->
    <div class="flex items-center gap-2.5">
      <div onclick="unlockAndTestAudio()" class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-amber-400 border-3 border-slate-800 flex items-center justify-center text-2xl shadow-[3px_3px_0px_#1E293B] cursor-pointer active:scale-95">
        🦁
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-lg sm:text-xl font-black tracking-tight text-slate-900">Nova 剑桥自然拼读点读机</h1>
          <span class="hidden xl:inline-block text-xs bg-teal-500 text-white px-2.5 py-0.5 rounded-full border-2 border-slate-800 font-bold">KB1 · U1-U3 (48词)</span>
        </div>
        <div class="flex items-center gap-2 text-xs text-slate-500 font-bold">
          <span id="audioStatusBadge" onclick="unlockAndTestAudio()" class="inline-flex items-center gap-1 text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-md border border-emerald-300 cursor-pointer">
            🔊 点此测试 iPad 声音
          </span>
          <span class="hidden sm:inline">点积木听拆音 · 左右滑动翻卡</span>
        </div>
      </div>
    </div>

    <!-- Center: 3 Interactive Modes Switcher -->
    <div class="flex bg-slate-200 p-1 rounded-2xl border-2 border-slate-800 gap-1">
      <button id="tabDeck" onclick="switchMode('deck')" class="px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl font-black text-xs sm:text-base transition-all bg-amber-400 text-slate-900 border-2 border-slate-800 shadow-[2px_2px_0px_#1E293B] flex items-center gap-1.5">
        <span>📖</span> <span>巨型大卡</span>
      </button>
      <button id="tabGrid" onclick="switchMode('grid')" class="px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl font-black text-xs sm:text-base transition-all text-slate-700 hover:text-slate-900 flex items-center gap-1.5">
        <span>🗂️</span> <span>网格总览</span>
      </button>
      <button id="tabGame" onclick="switchMode('game')" class="px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl font-black text-xs sm:text-base transition-all text-slate-700 hover:text-slate-900 flex items-center gap-1.5">
        <span>🧩</span> <span>拼积木闯关</span>
      </button>
    </div>

    <!-- Right: Star Counter, Streak & UK/US Accent -->
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1.5 bg-yellow-100 border-2 border-slate-800 px-3 py-1.5 rounded-xl font-black text-amber-900 shadow-[2px_2px_0px_#1E293B]">
        <span class="text-lg sm:text-xl">⭐</span>
        <span id="starCount" class="text-base sm:text-lg">0</span>
      </div>

      <button id="accentBtn" onclick="toggleAccent()" class="bauhaus-btn bg-white px-2.5 sm:px-3 py-1.5 rounded-xl font-black text-xs sm:text-sm flex items-center gap-1 active:bg-slate-100">
        <span id="accentFlag" class="text-base">🇬🇧</span>
        <span id="accentLabel" class="hidden md:inline">英音 UK</span>
      </button>
    </div>
  </header>

  <!-- ==================== MAIN WORKSPACE (SIDEBAR + CONTENT) ==================== -->
  <div class="flex-1 flex flex-col md:flex-row min-h-0 overflow-hidden">

    <!-- Left Sidebar (Landscape iPad) / Top Horizontal Bar (Portrait iPad) -->
    <aside class="shrink-0 bg-white border-b-3 md:border-b-0 md:border-r-4 border-slate-800 p-2.5 md:p-3.5 md:w-56 lg:w-64 flex md:flex-col justify-between gap-2 overflow-x-auto custom-scroll">
      <!-- Category Buttons -->
      <div id="categoryTabs" class="flex md:flex-col gap-2 min-w-max md:min-w-0">
        <button onclick="selectCategory('all')" data-cat="all" class="cat-btn bauhaus-btn px-3.5 py-2.5 rounded-2xl font-black text-sm lg:text-base bg-indigo-600 text-white flex items-center justify-between gap-2 text-left">
          <span>🌟 全部词汇</span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-black/20">48</span>
        </button>
        <button onclick="selectCategory('numbers')" data-cat="numbers" class="cat-btn bauhaus-btn px-3.5 py-2.5 rounded-2xl font-black text-sm lg:text-base bg-white text-slate-800 flex items-center justify-between gap-2 text-left">
          <span>🔢 U1 数字 1-10</span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-slate-200">10</span>
        </button>
        <button onclick="selectCategory('colors')" data-cat="colors" class="cat-btn bauhaus-btn px-3.5 py-2.5 rounded-2xl font-black text-sm lg:text-base bg-white text-slate-800 flex items-center justify-between gap-2 text-left">
          <span>🎨 U1&U3 颜色</span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-slate-200">11</span>
        </button>
        <button onclick="selectCategory('school')" data-cat="school" class="cat-btn bauhaus-btn px-3.5 py-2.5 rounded-2xl font-black text-sm lg:text-base bg-white text-slate-800 flex items-center justify-between gap-2 text-left">
          <span>🎒 U2 学校文具</span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-slate-200">8</span>
        </button>
        <button onclick="selectCategory('people')" data-cat="people" class="cat-btn bauhaus-btn px-3.5 py-2.5 rounded-2xl font-black text-sm lg:text-base bg-white text-slate-800 flex items-center justify-between gap-2 text-left">
          <span>👧 U2 人物代词</span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-slate-200">13</span>
        </button>
        <button onclick="selectCategory('toys')" data-cat="toys" class="cat-btn bauhaus-btn px-3.5 py-2.5 rounded-2xl font-black text-sm lg:text-base bg-white text-slate-800 flex items-center justify-between gap-2 text-left">
          <span>🚂 U3 玩具方位</span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-slate-200">14</span>
        </button>
      </div>

      <!-- Color Legend & Auto-Play Button (Bottom of Sidebar on Landscape) -->
      <div class="hidden md:flex flex-col gap-2.5 pt-3 border-t-2 border-slate-200">
        <div class="bg-slate-50 p-2.5 rounded-2xl border-2 border-slate-200 text-xs font-bold space-y-1.5">
          <div class="text-slate-500 font-black mb-1">🎨 积木颜色密码：</div>
          <div class="flex items-center gap-2">
            <span class="w-4 h-4 rounded bg-[#DBEAFE] border border-slate-800 inline-block"></span>
            <span class="text-blue-900">蓝色 = 辅音积木</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-4 h-4 rounded bg-[#FEF3C7] border border-slate-800 inline-block"></span>
            <span class="text-amber-900">暖橙 = 元音/组合</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="w-4 h-4 rounded bg-[#F1F5F9] border border-dashed border-slate-500 inline-block"></span>
            <span class="text-slate-500">虚线 = 魔法静音字母</span>
          </div>
        </div>

        <button id="autoPlayBtn" onclick="toggleAutoPlay()" class="bauhaus-btn w-full bg-emerald-400 hover:bg-emerald-300 text-slate-900 font-black py-3 px-3 rounded-2xl text-sm lg:text-base flex items-center justify-center gap-2">
          <span id="autoPlayIcon">▶️</span>
          <span id="autoPlayText">本组自动连播</span>
        </button>
      </div>
    </aside>

    <!-- ==================== RIGHT CONTENT STAGE ==================== -->
    <main class="flex-1 min-w-0 min-h-0 flex flex-col relative overflow-hidden p-3 sm:p-5">

      <!-- ==================== MODE 1: BIG IPAD FLASHCARD DECK (DEFAULT) ==================== -->
      <section id="deckSection" class="flex-1 flex flex-col justify-between min-h-0 gap-3">
        <!-- Main Stage: Left Arrow + Giant Card + Right Arrow -->
        <div id="deckTouchArea" class="flex-1 flex items-center justify-center gap-3 sm:gap-5 min-h-0">
          <!-- Prev Button -->
          <button onclick="stepDeck(-1)" class="bauhaus-btn shrink-0 w-12 h-24 sm:w-16 sm:h-32 rounded-3xl bg-white hover:bg-amber-100 flex flex-col items-center justify-center gap-1 text-2xl sm:text-3xl font-black">
            <span>⬅️</span>
            <span class="text-[11px] sm:text-xs text-slate-600">上一个</span>
          </button>

          <!-- Giant Flashcard -->
          <div id="bigCardContainer" class="flex-1 max-w-3xl h-full max-h-[540px] bg-white rounded-[2rem] bauhaus-card p-5 sm:p-7 flex flex-col justify-between relative overflow-hidden">
            <!-- Injected by renderBigCard() -->
          </div>

          <!-- Next Button -->
          <button onclick="stepDeck(1)" class="bauhaus-btn shrink-0 w-12 h-24 sm:w-16 sm:h-32 rounded-3xl bg-amber-300 hover:bg-amber-200 flex flex-col items-center justify-center gap-1 text-2xl sm:text-3xl font-black">
            <span>➡️</span>
            <span class="text-[11px] sm:text-xs text-slate-800">下一个</span>
          </button>
        </div>

        <!-- Bottom Thumbnail Quick-Jump Strip -->
        <div class="shrink-0 bg-white/90 border-2 border-slate-800 rounded-2xl p-2 flex items-center gap-2 overflow-x-auto custom-scroll shadow-[3px_3px_0px_#1E293B]">
          <div id="deckThumbs" class="flex items-center gap-2">
            <!-- Quick jump pills injected by JS -->
          </div>
        </div>
      </section>

      <!-- ==================== MODE 2: GRID VIEW ==================== -->
      <section id="gridSection" class="hidden flex-1 overflow-y-auto custom-scroll pr-1">
        <div id="cardsGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5 pb-8">
          <!-- Grid cards injected by JS -->
        </div>
      </section>

      <!-- ==================== MODE 3: TOUCH SPELLING GAME ==================== -->
      <section id="gameSection" class="hidden flex-1 flex items-center justify-center min-h-0 overflow-y-auto custom-scroll">
        <div class="w-full max-w-3xl bg-white rounded-[2rem] p-5 sm:p-7 bauhaus-card flex flex-col justify-between">
          <!-- Game Top Bar -->
          <div class="flex flex-wrap items-center justify-between gap-2 border-b-2 border-slate-200 pb-3 mb-4">
            <div class="flex items-center gap-2">
              <span class="bg-amber-400 border-2 border-slate-800 px-3.5 py-1 rounded-xl font-black text-base">
                第 <span id="gameIndex">1</span> / <span id="gameTotal">10</span> 题
              </span>
              <span id="streakBadge" class="bg-rose-100 text-rose-700 border-2 border-rose-300 px-3 py-1 rounded-xl font-black text-sm">
                🔥 连对 0
              </span>
            </div>

            <div class="flex items-center gap-2">
              <button onclick="setGameMode('blocks')" id="gmodeBlocks" class="bauhaus-btn px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-black bg-teal-400 text-slate-900">
                🧱 音节积木点按
              </button>
              <button onclick="setGameMode('missing')" id="gmodeMissing" class="bauhaus-btn px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-black bg-white text-slate-700">
                ✏️ 核心元音补全
              </button>
            </div>
          </div>

          <!-- Prompt Area -->
          <div class="flex flex-col items-center text-center">
            <div class="flex items-center gap-4 mb-2">
              <div id="gameEmoji" class="text-6xl sm:text-7xl select-none">🚂</div>
              <div class="text-left">
                <div id="gameMeaning" class="text-2xl sm:text-3xl font-black text-slate-900">火车</div>
                <div id="gameTip" class="text-xs sm:text-sm font-bold text-amber-800 bg-amber-50 border border-amber-300 px-3 py-1 rounded-xl mt-1">
                  💡 拼读口诀
                </div>
              </div>
            </div>

            <!-- Big Audio Triggers -->
            <div class="flex items-center gap-3 my-3">
              <button onclick="playGameAudio(false)" class="bauhaus-btn bg-indigo-500 active:bg-indigo-600 text-white px-5 py-2.5 rounded-2xl font-black text-base sm:text-lg flex items-center gap-2">
                <span>🔊</span> <span>听单词发音</span>
              </button>
              <button onclick="playGameAudio(true)" class="bauhaus-btn bg-amber-400 active:bg-amber-500 text-slate-900 px-5 py-2.5 rounded-2xl font-black text-base sm:text-lg flex items-center gap-2">
                <span>🐢</span> <span>慢速拆音提示</span>
              </button>
            </div>

            <!-- Target Slots -->
            <div id="gameSlots" class="flex flex-wrap items-center justify-center gap-3 min-h-[5.2rem] w-full bg-slate-50 border-3 border-dashed border-slate-300 rounded-2xl p-3.5 my-2">
              <!-- Slots rendered by JS -->
            </div>

            <!-- Feedback Banner -->
            <div id="gameFeedback" class="h-9 flex items-center justify-center font-black text-lg sm:text-xl my-1"></div>

            <!-- Choices Pool -->
            <div id="gamePool" class="flex flex-wrap items-center justify-center gap-3.5 my-2">
              <!-- Choice buttons rendered by JS -->
            </div>

            <!-- Bottom Navigation -->
            <div class="flex items-center justify-between w-full pt-3 mt-2 border-t-2 border-slate-100">
              <button onclick="resetCurrentQuestion()" class="bauhaus-btn bg-slate-100 text-slate-700 px-4 py-2.5 rounded-xl font-black text-sm">
                🔄 重拼本题
              </button>
              <button onclick="nextGameQuestion()" class="bauhaus-btn bg-emerald-400 text-slate-900 px-6 py-2.5 rounded-xl font-black text-base flex items-center gap-1.5">
                <span>下一题</span> <span>➡️</span>
              </button>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script>
    // ==================== COMPLETE KB1 (U1-U3) PHONICS DATABASE (48 WORDS) ====================
    // Block types: 'c' = consonant (blue), 'v' = vowel/digraph (warm amber), 's' = silent (gray dashed)
    const WORDS_DB = [
      // 1. U1 Numbers 1-10 (10 words)
      {
        id: 'one', word: 'one', syl: 'one', ipa: '/wʌn/', cn: '一 (1)', emoji: '1️⃣', cat: 'numbers',
        blocks: [{t:'o', k:'v', say:'wuh'}, {t:'n', k:'c', say:'n'}, {t:'e', k:'s', say:''}],
        tip: '特殊词(Sight Word)：o 在这里发 /wʌ/，词尾魔法 e 不发音',
        sentence: 'One table.'
      },
      {
        id: 'two', word: 'two', syl: 'two', ipa: '/tuː/', cn: '二 (2)', emoji: '2️⃣', cat: 'numbers',
        blocks: [{t:'t', k:'c', say:'t'}, {t:'w', k:'s', say:''}, {t:'o', k:'v', say:'oo'}],
        tip: 'w 藏起来不发音，t + o 直接读作 /tuː/',
        sentence: 'Two books.'
      },
      {
        id: 'three', word: 'three', syl: 'three', ipa: '/θriː/', cn: '三 (3)', emoji: '3️⃣', cat: 'numbers',
        blocks: [{t:'th', k:'c', say:'th'}, {t:'r', k:'c', say:'r'}, {t:'ee', k:'v', say:'ee'}],
        tip: 'th 轻轻咬舌尖吹气，双胞胎 ee 发长音 /iː/',
        sentence: 'Three chairs.'
      },
      {
        id: 'four', word: 'four', syl: 'four', ipa: '/fɔː/', cn: '四 (4)', emoji: '4️⃣', cat: 'numbers',
        blocks: [{t:'f', k:'c', say:'f'}, {t:'our', k:'v', say:'or'}],
        tip: '上牙轻碰下唇发 /f/，our 组合发长音 /ɔː/',
        sentence: "It's four."
      },
      {
        id: 'five', word: 'five', syl: 'five', ipa: '/faɪv/', cn: '五 (5)', emoji: '5️⃣', cat: 'numbers',
        blocks: [{t:'f', k:'c', say:'f'}, {t:'i', k:'v', say:'ai'}, {t:'v', k:'c', say:'v'}, {t:'e', k:'s', say:''}],
        tip: '魔法 e 结构 (i_e)：词尾 e 不发音，把 i 变成字母本身音 /aɪ/',
        sentence: "I'm five."
      },
      {
        id: 'six', word: 'six', syl: 'six', ipa: '/sɪks/', cn: '六 (6)', emoji: '6️⃣', cat: 'numbers',
        blocks: [{t:'s', k:'c', say:'s'}, {t:'i', k:'v', say:'ih'}, {t:'x', k:'c', say:'ks'}],
        tip: '标准三字母拼读：s(/s/) + i(/ɪ/) + x(/ks/)',
        sentence: 'Six orange chairs.'
      },
      {
        id: 'seven', word: 'seven', syl: 'sev · en', ipa: '/ˈsev.ən/', cn: '七 (7)', emoji: '7️⃣', cat: 'numbers',
        blocks: [{t:'s', k:'c', say:'s'}, {t:'e', k:'v', say:'eh'}, {t:'v', k:'c', say:'v'}, {t:'dot'}, {t:'e', k:'v', say:'uh'}, {t:'n', k:'c', say:'n'}],
        tip: '双音节词：第1音节 sev，第2音节 en',
        sentence: "He's seven."
      },
      {
        id: 'eight', word: 'eight', syl: 'eight', ipa: '/eɪt/', cn: '八 (8)', emoji: '8️⃣', cat: 'numbers',
        blocks: [{t:'ei', k:'v', say:'ay'}, {t:'gh', k:'s', say:''}, {t:'t', k:'c', say:'t'}],
        tip: 'ei 发 /eɪ/，中间 gh 隐身不发音，加上小尾巴 t',
        sentence: "She's eight."
      },
      {
        id: 'nine', word: 'nine', syl: 'nine', ipa: '/naɪn/', cn: '九 (9)', emoji: '9️⃣', cat: 'numbers',
        blocks: [{t:'n', k:'c', say:'n'}, {t:'i', k:'v', say:'ai'}, {t:'n', k:'c', say:'n'}, {t:'e', k:'s', say:''}],
        tip: '魔法 e 结构 (i_e)：i 发本身音 /aɪ/，词尾 e 不发音',
        sentence: "It's nine."
      },
      {
        id: 'ten', word: 'ten', syl: 'ten', ipa: '/ten/', cn: '十 (10)', emoji: '🔟', cat: 'numbers',
        blocks: [{t:'t', k:'c', say:'t'}, {t:'e', k:'v', say:'eh'}, {t:'n', k:'c', say:'n'}],
        tip: '极简三字母短音词 (CVC)：t + e(/e/) + n',
        sentence: 'Ten pencils.'
      },

    // ==================== NATIVE WEB AUDIO SYNTHESIZER (NO EXTERNAL DEPENDENCY) ====================
    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playChime(type) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now); // D5
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        } else if (type === 'win') {
          const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.085);
            gain.gain.setValueAtTime(0.22, now + idx * 0.085);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.085 + 0.22);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.085);
            osc.stop(now + idx * 0.085 + 0.23);
          });
        } else if (type === 'oops') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(175, now + 0.18);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        }
      } catch (e) {}
    }

    // ==================== WEB SPEECH API (iPad Safari Optimized) ====================
    function speakText(text, rate = 0.88, onEndCallback = null) {
      if (!('speechSynthesis' in window)) {
        if (onEndCallback) setTimeout(onEndCallback, 500);
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = currentAccent;
      utter.rate = rate;
      utter.pitch = 1.06;

      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => v.lang === currentAccent && (v.name.includes('Daniel') || v.name.includes('Martha') || v.name.includes('Arthur') || v.name.includes('Samantha') || v.name.includes('Natural') || v.name.includes('Google')))
                     || voices.find(v => v.lang.startsWith(currentAccent.slice(0, 2)));
      if (preferred) utter.voice = preferred;

      let callbackFired = false;
      const done = () => {
        if (!callbackFired && onEndCallback) {
          callbackFired = true;
          onEndCallback();
        }
      };

      utter.onend = done;
      utter.onerror = done;
      window.speechSynthesis.speak(utter);

      // Fallback timer in case iOS Safari speechSynthesis onend doesn't fire
      if (onEndCallback) {
        setTimeout(done, Math.max(1800, text.length * 140));
      }
    }

    // Touch Swipe Gesture Support on Giant Card Stage
    (function initSwipeGesture() {
      let startX = 0;
      let startY = 0;
      document.addEventListener('DOMContentLoaded', () => {
        const area = document.getElementById('deckTouchArea');
        if (!area) return;
        area.addEventListener('touchstart', e => {
          if (e.touches.length === 1) {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
          }
        }, { passive: true });

        area.addEventListener('touchend', e => {
          if (e.changedTouches.length === 1) {
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;
            if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
              if (dx < 0) stepDeck(1);
              else stepDeck(-1);
            }
          }
        }, { passive: true });
      });
    })();

    // ==================== PHONICS SLOW BREAKDOWN & BLOCK TAP AUDIO ====================
    // Phonetic pronounceable approximations so TTS speaks crisp phoneme sounds
    const PHONEME_TTS_MAP = {
      'b': 'buh', 'c': 'kuh', 'ck': 'k', 'd': 'duh', 'f': 'f', 'g': 'guh',
      'h': 'huh', 'k': 'k', 'l': 'l', 'll': 'l', 'm': 'm', 'n': 'n',
      'p': 'puh', 'r': 'r', 's': 's', 't': 'tuh', 'v': 'v', 'w': 'wuh',
      'wh': 'wuh', 'x': 'ks', 'y': 'yuh', 'z': 'z',
      'bl': 'bl', 'br': 'br', 'tr': 'tr', 'gr': 'gr', 'fr': 'fr', 'st': 'st', 'nk': 'nk',
      'ch': 'ch', 'sh': 'sh', 'th': 'th',
      'a': 'a', 'e': 'eh', 'i': 'ih', 'o': 'o', 'u': 'uh',
      'ee': 'ee', 'oo': 'oo', 'ai': 'ay', 'ay': 'ay', 'ei': 'ay',
      'ow': 'ow', 'ou': 'ow', 'our': 'or', 'ar': 'ar', 'er': 'er', 'ir': 'er', 'ur': 'er',
      'air': 'air', 'ere': 'air', 'oy': 'oy', 'ue': 'oo', 'le': 'ul', 'ge': 'j'
    };

    function playSingleBlock(wordId, blockIndex, sayHint, fullWord, viewScope = 'deck') {
      stopAutoPlay();
      const selector = viewScope === 'deck'
        ? `[data-deck-blocks="${wordId}"] .ph-block`
        : `[data-card-blocks="${wordId}"] .ph-block`;
      const domBlocks = document.querySelectorAll(selector);

      if (domBlocks[blockIndex]) {
        domBlocks.forEach(b => b.classList.remove('ph-active'));
        domBlocks[blockIndex].classList.add('ph-active');
        setTimeout(() => domBlocks[blockIndex].classList.remove('ph-active'), 550);
      }

      playChime('pop');
      const item = WORDS_DB.find(w => w.id === wordId);
      if (!item) return;
      const realBlocks = item.blocks.filter(b => b.t !== 'dot');
      const blk = realBlocks[blockIndex];

      if (!blk || blk.k === 's') {
        // Silent letter: just chime, no speech
        return;
      }

      const soundText = PHONEME_TTS_MAP[blk.t] || blk.t;
      speakText(`${soundText}. ${item.word}`, 0.72);
    }

    function playSlowPhonics(wordId, viewScope = 'deck') {
      stopAutoPlay();
      const item = WORDS_DB.find(w => w.id === wordId);
      if (!item) return;

      const selector = viewScope === 'deck'
        ? `[data-deck-blocks="${wordId}"] .ph-block`
        : `[data-card-blocks="${wordId}"] .ph-block`;
      const domBlocks = document.querySelectorAll(selector);
      domBlocks.forEach(b => b.classList.remove('ph-active'));

      let step = 0;
      function highlightStep() {
        if (step < domBlocks.length) {
          domBlocks.forEach(b => b.classList.remove('ph-active'));
          domBlocks[step].classList.add('ph-active');
          playChime('pop');
          step++;
          setTimeout(highlightStep, 380);
        } else {
          domBlocks.forEach(b => b.classList.remove('ph-active'));
        }
      }
      highlightStep();

      const syllables = item.syl.split('·').map(s => s.trim());
      const slowPhrase = syllables.length > 1
        ? `${syllables.join(', ')}. ${item.word}!`
        : `${item.word}, ${item.word}!`;

      speakText(slowPhrase, 0.56);
    }

    function playWordAndSentence(wordId, withSentence = false) {
      stopAutoPlay();
      const item = WORDS_DB.find(w => w.id === wordId);
      if (!item) return;
      playChime('pop');
      if (withSentence) {
        speakText(`${item.word}. ${item.sentence}`, 0.86);
      } else {
        speakText(item.word, 0.86);
      }
    }

    // ==================== AUTO-PLAY ALL IN CATEGORY ====================
    function toggleAutoPlay() {
      if (isAutoPlaying) stopAutoPlay();
      else startAutoPlay();

    function startAutoPlay() {
      const list = getFilteredWords();
      if (!list.length) return;
      isAutoPlaying = true;
      document.getElementById('autoPlayIcon').textContent = '⏹️';
      document.getElementById('autoPlayText').textContent = '停止自动连播';
      const btn = document.getElementById('autoPlayBtn');
      btn.classList.replace('bg-emerald-400', 'bg-rose-400');

      function stepAuto() {
        if (!isAutoPlaying) return;
        const item = list[deckIndex];
        if (currentMode === 'deck') {
          renderBigCard();
        } else if (currentMode === 'grid') {
          const cardEl = document.getElementById(`card-${item.id}`);
          document.querySelectorAll('.word-card').forEach(c => c.classList.remove('ring-4', 'ring-rose-500'));
          if (cardEl) {
            cardEl.classList.add('ring-4', 'ring-rose-500');
            cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
        speakText(`${item.word}. ${item.sentence}`, 0.82, () => {
          if (!isAutoPlaying) return;
          deckIndex = (deckIndex + 1) % list.length;
          autoPlayTimer = setTimeout(stepAuto, 750);
        });
      }
      stepAuto();
    }

    function stopAutoPlay() {
      isAutoPlaying = false;
      if (autoPlayTimer) clearTimeout(autoPlayTimer);
      document.getElementById('autoPlayIcon').textContent = '▶️';
      document.getElementById('autoPlayText').textContent = '本组自动连播';
      const btn = document.getElementById('autoPlayBtn');
      btn.classList.remove('bg-rose-400');
      btn.classList.add('bg-emerald-400');
      document.querySelectorAll('.word-card').forEach(c => c.classList.remove('ring-4', 'ring-rose-500'));

    // ==================== CATEGORY & MODE SWITCHING ====================
    function selectCategory(cat) {
      stopAutoPlay();
      currentCategory = cat;
      deckIndex = 0;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.classList.remove('bg-white', 'text-slate-800');

        { id: 'grid', tab: 'tabGrid', sec: 'gridSection' },

    function renderBlockPuzzle(item, realBlocks) {
      const slotsEl = document.getElementById('gameSlots');
      const poolEl = document.getElementById('gamePool');

      slotsEl.innerHTML = realBlocks.map((_, i) => `
        <div id="slot-${i}" class="min-w-[4.2rem] h-16 rounded-2xl border-3 border-dashed border-slate-400 bg-white flex items-center justify-center text-3xl sm:text-4xl font-black text-slate-800 px-4">
          ?
        </div>
      `).join('');

      const distractors = ['ck', 'sh', 'ch', 'th', 'ai', 'ee', 'oo', 'ar', 'er', 'bl', 'tr'];
      const correctTexts = realBlocks.map(b => b.t);
      const extra = distractors.filter(d => !correctTexts.includes(d)).sort(() => Math.random() - 0.5).slice(0, 2);

      const choices = [
        ...realBlocks.map((b, idx) => ({ t: b.t, k: b.k, id: `c-${idx}` })),
        ...extra.map((t, idx) => ({ t, k: 'c', id: `d-${idx}` }))
      ].sort(() => Math.random() - 0.5);

      poolEl.innerHTML = choices.map(ch => {
        const cls = ch.k === 'v' ? 'ph-v' : (ch.k === 's' ? 'ph-s' : 'ph-c');
        return `
          <button id="btn-${ch.id}" onclick="pickBlockChoice('${ch.id}', '${ch.t}')"
                  class="bauhaus-btn ${cls} px-6 py-3.5 rounded-2xl text-3xl sm:text-4xl font-black">
            ${ch.t}
          </button>
        `;
      }).join('');
    }

    function pickBlockChoice(btnId, text) {
      const item = getCurrentGameItem();
      const realBlocks = item.blocks.filter(b => b.t !== 'dot');
      const targetIndex = currentFilled.length;
      if (targetIndex >= realBlocks.length) return;

      const expected = realBlocks[targetIndex].t;
      const fb = document.getElementById('gameFeedback');

      if (text === expected) {
        playChime('pop');
        currentFilled.push(text);
        const slot = document.getElementById(`slot-${targetIndex}`);
        slot.textContent = text;
        slot.className = 'min-w-[4.2rem] h-16 rounded-2xl border-3 border-slate-800 bg-amber-200 flex items-center justify-center text-3xl sm:text-4xl font-black text-slate-900 px-4 star-pop';
        const btn = document.getElementById(`btn-${btnId}`);
        if (btn) btn.classList.add('opacity-25', 'pointer-events-none');

        if (currentFilled.length === realBlocks.length) {
          playChime('win');
          addStar(2);
          streakCount++;
          document.getElementById('streakBadge').textContent = `🔥 连对 ${streakCount}`;
          fb.innerHTML = `<span class="text-emerald-600 star-pop">🎉 太棒啦！${item.word} 拼写完全正确！+2 ⭐</span>`;
          speakText(`Awesome! ${item.word}!`, 0.9);
        }
      } else {
        playChime('oops');
        streakCount = 0;
        document.getElementById('streakBadge').textContent = `🔥 连对 0`;
        fb.innerHTML = `<span class="text-rose-500">🤔 再听一听，第 ${targetIndex + 1} 块积木是哪个呢？</span>`;
      }
    }

    function renderMissingPuzzle(item, realBlocks) {
      const slotsEl = document.getElementById('gameSlots');
      const poolEl = document.getElementById('gamePool');

      let hideIdx = realBlocks.findIndex(b => b.k === 'v');
      if (hideIdx === -1) hideIdx = 0;
      missingCharTarget = realBlocks[hideIdx].t;

      slotsEl.innerHTML = realBlocks.map((b, i) => {
        if (i === hideIdx) {
          return `<div id="missingSlot" class="min-w-[4.8rem] h-16 rounded-2xl border-3 border-dashed border-amber-500 bg-amber-50 flex items-center justify-center text-3xl sm:text-4xl font-black text-amber-700 px-4">?</div>`;
        }
        return `<div class="min-w-[3.8rem] h-16 rounded-2xl border-3 border-slate-800 bg-white flex items-center justify-center text-3xl sm:text-4xl font-black text-slate-900 px-4">${b.t}</div>`;
      }).join('');

      const distractors = ['a', 'e', 'i', 'o', 'u', 'ee', 'ai', 'oo', 'ar', 'er', 'ow', 'ck', 'tr', 'bl'];
      const options = [
        missingCharTarget,
        ...distractors.filter(d => d !== missingCharTarget).sort(() => Math.random() - 0.5).slice(0, 3)
      ].sort(() => Math.random() - 0.5);

      poolEl.innerHTML = options.map(opt => `
        <button onclick="pickMissingOption('${opt}')" class="bauhaus-btn ph-v px-7 py-3.5 rounded-2xl text-3xl sm:text-4xl font-black">
          ${opt}
        </button>
      `).join('');
    }

    function pickMissingOption(opt) {
      const item = getCurrentGameItem();
      const fb = document.getElementById('gameFeedback');
      if (opt === missingCharTarget) {
        playChime('win');
        addStar(2);
        streakCount++;
        document.getElementById('streakBadge').textContent = `🔥 连对 ${streakCount}`;
        const slot = document.getElementById('missingSlot');
        if (slot) {
          slot.textContent = opt;
          slot.className = 'min-w-[4.8rem] h-16 rounded-2xl border-3 border-slate-800 bg-emerald-300 flex items-center justify-center text-3xl sm:text-4xl font-black text-slate-900 px-4 star-pop';
        }
        fb.innerHTML = `<span class="text-emerald-600 star-pop">🌟 完美命中！${item.word}！+2 ⭐</span>`;
        speakText(`${item.word}!`, 0.9);
      } else {
        playChime('oops');
        streakCount = 0;
        document.getElementById('streakBadge').textContent = `🔥 连对 0`;
        fb.innerHTML = `<span class="text-rose-500">👂 点【🐢 慢速拆音提示】再听一次吧！</span>`;
      }
    }

    function resetCurrentQuestion() {
      loadGameQuestion();
    }

    function nextGameQuestion() {
      gameIdx = (gameIdx + 1) % gamePoolList.length;
      loadGameQuestion();
    }

    // Initialize on load
    window.onload = function () {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
      }
      renderBigCard();
      renderGridCards();
    };
  </script>
</body>
</html>
